const K='mivida-v1';let data;try{data=JSON.parse(localStorage.getItem(K))}catch{};data=data&&typeof data==='object'?data:{};for(const k of ['items','subjects','routines','workouts','habits','purchases','goals','messages','budgets','savingsGoals','sports'])if(!Array.isArray(data[k]))data[k]=[];data.habitLogs??={};data.reminderSettings??={enabled:true,daysBefore:0};data.dismissedReminders??={};data.favorites??=['Estudios','Deporte','Finanzas'];data.shortcuts??=['Calendario','Estudios','Finanzas'];data.welcome??=false;data.theme=['auto','light','dark'].includes(data.theme)?data.theme:'auto';let financeMonth=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');let calView='mes',calCursor=null,calSelected=null,calFilters=['Estudios','Tareas','Salud','Hobbies','Otros','Clases'];let previousPage='Mi día';let page='Mi día',drawer=false,form=null,selected=null,session=null,notice='',undo=null,pendingPurchase=null,assistantPending=null;const sections=['Mi día','Calendario','Estudios','Deporte','Finanzas','Hábitos','Objetivos','Salud','Hobbies','Compras','Bandeja','Asistente','Ajustes'];const icons={'Mi día':'🏠','Calendario':'📅','Estudios':'📚','Deporte':'🏋️','Finanzas':'💶','Hábitos':'🌱','Objetivos':'🎯','Salud':'🩺','Hobbies':'🎨','Compras':'🛍️','Bandeja':'📥','Asistente':'✨','Ajustes':'⚙️'};const uid=()=>Math.random().toString(36).slice(2)+Date.now();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);const val=id=>document.getElementById(id)?.value?.trim()||'';const save=()=>{try{localStorage.setItem(K,JSON.stringify(data));return true}catch{notice='No se han podido guardar los datos. Comprueba el almacenamiento del iPhone.';return false}};const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const amount=s=>Number(String(s).replace(',','.'));const nav=p=>{if(page!==p)previousPage=page;page=p;form=null;drawer=false;notice='';render()};const add=(kind='Tarea')=>{form={kind,from:page};drawer=false;render()};const goBack=()=>{if(drawer){drawer=false}else if(form){if(form.kind==='exercise'){form={kind:form.workout?'workout':'routineDetail'}}else if(form.kind==='workout'){if(!confirm('¿Salir del entrenamiento sin guardar?'))return;session=null;form=null;page='Deporte'}else{form=null}}else{page='Mi día'}notice='';render()};const cancelForm=()=>goBack();const notify=t=>{notice=t;render()};const remove=(group,id)=>{if(!confirm('¿Eliminar este elemento?'))return;data[group]=data[group].filter(x=>x.id!==id);save();render()};const eventItems=()=>data.items.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));const fields=(label,id,type='text',value='',extra='')=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`;const button=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;const empty=t=>`<div class="empty">${t}</div>`;

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseLocalDate(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function calendarCategory(x){return ['Examen','Sesión de estudio'].includes(x.type)?'Estudios':x.type==='Tarea'?'Tareas':x.type==='Cita médica'?'Salud':x.type==='Plan'?'Hobbies':'Otros'}
function calendarClass(x){const c=calendarCategory(x);return c==='Estudios'?'exam':c==='Salud'?'health':c==='Hobbies'?'plan':''}
function calendarMove(n){const d=parseLocalDate(calCursor||today());if(calView==='mes'){d.setDate(1);d.setMonth(d.getMonth()+n);}else d.setDate(d.getDate()+(calView==='semana'?7:1)*n);calCursor=localDate(d);calSelected=calView==='mes'?localDate(new Date(d.getFullYear(),d.getMonth(),1)):calCursor;render()}
function calendarSetView(v){calView=v;calCursor=calSelected||today();render()}
function calendarSetDay(day){calSelected=day;render()}
function calendarFilter(cat,on){calFilters=on?[...new Set([...calFilters,cat])]:calFilters.filter(x=>x!==cat);render()}
function calendarView(){const current=parseLocalDate(calCursor||today()),selected=calSelected||today(),all=eventItems().filter(x=>calFilters.includes(calendarCategory(x)));const month=current.toLocaleDateString('es-ES',{month:'long',year:'numeric'});let h=`<div class="cal-toolbar"><div class="actions"><button class="btn small secondary" onclick="calendarMove(-1)" aria-label="Anterior">‹</button><button class="btn small secondary" onclick="calCursor=today();calSelected=today();render()">Hoy</button><button class="btn small secondary" onclick="calendarMove(1)" aria-label="Siguiente">›</button></div><strong>${esc(month.charAt(0).toUpperCase()+month.slice(1))}</strong></div><div class="actions">${['mes','semana','día'].map(v=>`<button class="btn small ${calView===v?'':'secondary'}" onclick="calendarSetView('${v}')">${v.charAt(0).toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="cal-filters">${['Estudios','Tareas','Salud','Hobbies','Otros','Clases'].map(c=>`<label><input type="checkbox" ${calFilters.includes(c)?'checked':''} onchange="calendarFilter('${c}',this.checked)">${c}</label>`).join('')}</div>`;
let dates=[];if(calView==='mes'){const first=new Date(current.getFullYear(),current.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(first.getFullYear(),first.getMonth(),1-offset);for(let i=0;i<42;i++)dates.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i))}else if(calView==='semana'){const monday=new Date(current.getFullYear(),current.getMonth(),current.getDate()-(current.getDay()+6)%7);for(let i=0;i<7;i++)dates.push(new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i))}else dates=[parseLocalDate(selected)];
if(calView!=='día'){h+='<div class="cal-grid">'+['L','M','X','J','V','S','D'].map(d=>`<div class="cal-head">${d}</div>`).join('');h+=dates.map(d=>{const key=localDate(d),events=all.filter(x=>x.date===key),sportsCount=data.sports.filter(sp=>(sp.days||[]).includes((d.getDay()+6)%7)).length,classesCount=calFilters.includes('Clases')?data.subjects.filter(sub=>(sub.classDays||[]).includes((d.getDay()+6)%7)).length:0,outside=calView==='mes'&&d.getMonth()!==current.getMonth();return `<button class="cal-day ${outside?'outside':''} ${key===selected?'selected':''} ${key===today()?'today':''}" onclick="calendarSetDay('${key}')" aria-label="${esc(key)}: ${events.length+sportsCount+classesCount} eventos"><b>${d.getDate()}</b><div class="cal-dots">${events.slice(0,4).map(x=>`<span class="cal-dot ${calendarClass(x)}"></span>`).join('')}${sportsCount?'<span class="cal-dot" style="background:#29a68c"></span>':''}${classesCount?'<span class="cal-dot" style="background:#6478e7"></span>':''}</div></button>`}).join('')+'</div>'}
const dayEvents=all.filter(x=>x.date===selected);const sportDay=(parseLocalDate(selected).getDay()+6)%7;const sportsToday=data.sports.filter(sp=>(sp.days||[]).includes(sportDay));const classesToday=calFilters.includes('Clases')?data.subjects.filter(s=>(s.classDays||[]).includes(sportDay)):[];h+=`<div class="cal-daylist"><h3>${esc(parseLocalDate(selected).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</h3>${(dayEvents.length||sportsToday.length||classesToday.length)?dayEvents.map(x=>`<div class="card cal-event ${calendarClass(x)}"><div class="row between"><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(x.type)}${x.subject?' · '+esc(data.subjects.find(s=>s.id===x.subject)?.name||''):''}</small></div><button class="btn small secondary" onclick="editItem('items','${x.id}')">Editar</button></div></div>`).join('')+sportsToday.map(sp=>`<div class="card cal-event"><strong>🏃 ${esc(sp.name)}</strong><small>Deporte${sp.time?' · '+esc(sp.time):''}</small></div>`).join('')+classesToday.map(s=>`<div class="card cal-event"><strong>📚 Clase de ${esc(s.name)}</strong><small>${s.classTime?esc(s.classTime):'Hora sin indicar'}${s.classEnd?' – '+esc(s.classEnd):''}${s.professor?' · '+esc(s.professor):''}</small></div>`).join(''):empty('No hay eventos este día.')}<div class="actions">${button('+ Evento',"add('Plan')",'secondary')}${button('+ Examen',"add('Examen')",'secondary')}${button('+ Tarea',"add('Tarea')",'secondary')}</div></div>`;return h}

function dueReminders(){
 if(!data.reminderSettings.enabled)return [];
 const start=today(),end=parseLocalDate(start);
 end.setDate(end.getDate()+Number(data.reminderSettings.daysBefore||0));
 const until=localDate(end);
 return data.items.filter(x=>{if(!x.date||x.done||['Gasto','Ingreso'].includes(x.type)||data.dismissedReminders[x.id+'@'+start]||x.reminderDays===-1)return false;const days=x.reminderDays==null?Number(data.reminderSettings.daysBefore||0):Number(x.reminderDays);const limit=parseLocalDate(start);limit.setDate(limit.getDate()+days);return x.date>=start&&x.date<=localDate(limit)});
}
function dismissReminder(id){data.dismissedReminders[id+'@'+today()]=true;save();render()}
function updateReminderSetting(key,value){if(key==='enabled')data.reminderSettings.enabled=!!value;else data.reminderSettings.daysBefore=Math.max(0,Math.min(7,Number(value)||0));save();render()}
function remindersPanel(){const due=dueReminders(),active=!!data.reminderSettings.enabled;return `<section class="today-reminders ${due.length?'has-due':''} ${active?'':'off'}" aria-label="Avisos y recordatorios"><div class="today-reminder-head"><span class="today-reminder-icon">🔔</span><div class="grow"><h3>Avisos y recordatorios</h3><p>${!active?'Desactivados en Ajustes':due.length?`${due.length} ${due.length===1?'aviso pendiente':'avisos pendientes'} para ti`:'Todo al día · Sin avisos pendientes'}</p></div></div>${due.map(x=>`<div class="today-reminder-item"><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(x.type)} · ${esc(x.date)}</small></div><button class="btn small secondary" onclick="dismissReminder('${x.id}')">Visto</button></div>`).join('')}${due.length?'':`<p class="today-reminder-empty">${active?'Cuando tengas un examen, una cita o una actividad próxima, aparecerá aquí.':'Activa los avisos para ver tus próximos recordatorios.'}</p>`}<div class="actions"><button class="btn small secondary" onclick="nav('Ajustes')">⚙️ Configurar avisos</button><button class="btn small secondary" onclick="nav('Calendario')">📅 Ver calendario</button></div><p class="today-reminder-foot">Los avisos se muestran al abrir MiVida. Aún no llegan a la pantalla bloqueada.</p></section>`}
function priorityPanel(){const priorities=data.items.filter(x=>x.type==='Tarea'&&x.priority&&!x.done).slice(0,3);return `<section class="today-priorities" aria-label="Mis tres prioridades"><div class="today-heading"><h3>⭐ Mis 3 prioridades</h3><span class="pill">${priorities.length}/3</span></div><p class="today-hint">Lo más importante de hoy, siempre a la vista.</p>${priorities.map((x,i)=>`<div class="today-priority"><span class="today-priority-number">${i+1}</span><div class="grow"><strong>${esc(x.title)}</strong><small>${x.date?'📅 '+esc(x.date):'Sin fecha asignada'}</small></div><div class="today-priority-actions"><button class="done" aria-label="Completar prioridad" onclick="toggle('items','${x.id}',true)">✓</button><button aria-label="Quitar de prioridades" onclick="togglePriority('${x.id}')">☆</button></div></div>`).join('')}${Array.from({length:3-priorities.length},(_,i)=>`<div class="today-priority-placeholder">${priorities.length+i+1}. Espacio libre para una prioridad</div>`).join('')}<div class="actions"><button class="btn small" onclick="add('Tarea')">+ Nueva tarea</button><button class="btn small secondary" onclick="nav('Estudios')">Ver mis tareas</button></div><p class="today-hint">Para destacar una tarea existente, pulsa ☆ junto a ella en Estudios.</p></section>`}

function render(){applyTheme();const root=document.getElementById('app');let html=`<header><div class="logo"><span>✦</span>MiVida</div><button class="iconbtn" aria-label="Volver" onclick="goBack()">←</button><button class="iconbtn" onclick="drawer=true;render()">☰</button></header>`;if(!data.welcome)html+=welcome();else if(form)html+=formView();else html+=`<main class="page"><div class="muted">TU ESPACIO PERSONAL</div><div class="title">${esc(page)} ${icons[page]||''}</div>${page==='Mi día'?remindersPanel():''}${content()}</main>`;if(data.welcome)html+=`<button class="fab" aria-label="Añadir" onclick="add()">+</button><nav class="bottom">${['Mi día',...data.shortcuts].map(x=>`<button class="${page===x?'active':''}" onclick="nav('${x}')"><b>${icons[x]}</b>${esc(x)}</button>`).join('')}</nav>`;if(drawer)html+=`<div class="drawer" onclick="drawer=false;render()"><div class="drawer-inner" onclick="event.stopPropagation()"><h2>Todos los apartados</h2>${sections.map(x=>`<button onclick="nav('${x}')">${icons[x]} ${x}</button>`).join('')}</div></div>`;root.innerHTML=html;}
function welcome(){return `<main class="page"><h1>Bienvenido a MiVida 💙</h1><p>Organiza tu vida a tu manera. Puedes configurar todo más adelante.</p><div class="card tint"><b>Configuración guiada opcional</b><p class="muted">Empieza sin datos de ejemplo. Crea tus asignaturas, rutinas y objetivos cuando quieras.</p></div>${button('Empezar con MiVida','start()')} ${button('Saltar configuración','start()','secondary')}</main>`}function start(){data.welcome=true;save();nav('Mi día')}
function togglePriority(id){const x=data.items.find(v=>v.id===id&&v.type==='Tarea');if(!x)return;if(!x.priority&&data.items.filter(v=>v.type==='Tarea'&&v.priority&&!v.done).length>=3){notice='Puedes tener hasta tres prioridades pendientes. Quita una para elegir otra.';render();return;}x.priority=!x.priority;save();render()}
function itemRow(x,group='items'){return `<div class="listitem"><div class="grow"><strong>${esc(x.title||x.name)}</strong><small>${esc(x.type||'')}${x.date?' · '+esc(x.date):''}${x.amount!=null?' · '+money(x.amount):''}</small></div>${x.type==='Tarea'?`<button class="btn small secondary" aria-label="${x.priority?'Quitar prioridad':'Marcar prioridad'}" onclick="togglePriority('${x.id}')">${x.priority?'★':'☆'}</button>`:''}${x.type==='Tarea'||x.type==='Hábito'?`<input class="check" type="checkbox" ${x.done?'checked':''} onchange="toggle('${group}','${x.id}',this.checked)">`:''}<button class="btn small secondary" onclick="editItem('${group}','${x.id}')">✎</button><button class="btn small danger" onclick="remove('${group}','${x.id}')">×</button></div>`}
function content(){let h=notice?`<div class="notice">${esc(notice)}</div>`:'';if(page==='Mi día'){const upcoming=eventItems().filter(x=>x.date>=today()).slice(0,5),pending=data.items.filter(x=>x.type==='Tarea'&&!x.done).length,priorityCount=data.items.filter(x=>x.type==='Tarea'&&x.priority&&!x.done).length,sportsToday=data.sports.filter(sp=>(sp.days||[]).includes((new Date().getDay()+6)%7)),itemsToday=data.items.filter(x=>x.date===today()&&!['Gasto','Ingreso'].includes(x.type));return h+`<section class="today-hero"><div class="eyebrow">${esc(new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</div><h2>Tu día, más claro ✨</h2><p>Organiza lo importante y no te pierdas nada.</p><div class="today-stats"><div class="today-stat"><strong>${pending}</strong><span>Tareas pendientes</span></div><div class="today-stat"><strong>${priorityCount}/3</strong><span>Prioridades elegidas</span></div></div></section>${priorityPanel()}<section class="today-section"><div class="today-heading"><h3>☀️ Para hoy</h3><button class="btn small secondary" onclick="nav('Calendario')">Calendario</button></div>${sportsToday.map(sp=>`<div class="listitem"><div class="grow"><strong>🏃 ${esc(sp.name)}</strong><small>Deporte${sp.time?' · '+esc(sp.time):''}</small></div></div>`).join('')}${itemsToday.map(x=>itemRow(x)).join('')}${(!sportsToday.length&&!itemsToday.length)?empty('Hoy no tienes actividades programadas.'):''}</section><section class="today-section"><div class="today-heading"><h3>📅 Próximos eventos</h3></div>${upcoming.length?upcoming.map(x=>itemRow(x)).join(''):empty('Aún no tienes eventos próximos.')}</section><section class="today-section"><h3>Mis favoritos</h3><div class="grid">${data.favorites.map(x=>`<button class="tile" onclick="nav('${x}')"><span class="emoji">${icons[x]}</span>${x}</button>`).join('')}</div>${button('✨ Asistente MiVida',"nav('Asistente')",'secondary')}</section>`}if(page==='Calendario')return h+calendarView();
if(page==='Estudios')return h+`<div class="notice">Las clases con días seleccionados se repiten semanalmente en el Calendario.</div>`+`<div class="actions">${button('+ Asignatura',"add('Asignatura')")}${button('+ Examen',"add('Examen')",'secondary')}${button('+ Tarea',"add('Tarea')",'secondary')}${button('+ Estudiar',"add('Sesión de estudio')",'secondary')}</div><h3>Mis asignaturas</h3>${data.subjects.length?data.subjects.map((s,i)=>`<div class="card"><div class="row between"><div class="grow"><strong><span style="color:${safeColor(s.color)}">●</span> ${esc(s.name)}</strong>${s.professor?`<p class="muted">Profesor/a: ${esc(s.professor)}</p>`:''}${s.schedule?`<p class="muted">Horario: ${esc(s.schedule)}</p>`:''}${(s.classDays||[]).length?`<p class="muted">Clases: ${(s.classDays||[]).map(i=>['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]).join(', ')}${s.classTime?' · '+esc(s.classTime):''}</p>`:''}${s.note?`<p class="muted">${esc(s.note)}</p>`:''}</div></div><div class="actions"><button class="btn small secondary" ${i===0?'disabled':''} onclick="moveSubject(${i},-1)">↑</button><button class="btn small secondary" ${i===data.subjects.length-1?'disabled':''} onclick="moveSubject(${i},1)">↓</button>${button('Editar',`editItem('subjects','${s.id}')`,'secondary')}${button('+ Nota',`addGrade('${s.id}')`,'secondary')}${button('Eliminar',`deleteSubject('${s.id}')`,'danger')}</div>${(s.grades||[]).length?`<div class="muted">Calificaciones: ${(s.grades||[]).map(g=>`${esc(g.label)}: ${esc(g.value)}`).join(' · ')}</div>`:''}</div>`).join(''):empty('Añade tus propias asignaturas.')}<h3>Exámenes, tareas y estudio</h3>${data.items.filter(x=>['Examen','Tarea','Sesión de estudio'].includes(x.type)).map(x=>itemRow(x)).join('')||empty('No hay actividades todavía.')}`;
if(page==='Deporte')return h+`${button('+ Crear deporte',"add('Deporte programado')")}${button('+ Crear rutina',"add('Rutina')")}<h3>Deportes programados</h3>${data.sports.map(sp=>`<div class="card"><b>${esc(sp.name)}</b><p class="muted">${(sp.days||[]).map(d=>['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][d]).join(', ')||'Sin días'}${sp.time?' · '+esc(sp.time):''}</p><div class="actions">${button('Editar',`editItem('sports','${sp.id}')`,'secondary')}${button('Eliminar',`remove('sports','${sp.id}')`,'danger')}</div></div>`).join('')||empty('Añade tus deportes y los días en que los practicas.')} <h3>Mis rutinas</h3>${data.routines.map(r=>`<div class="card"><div class="row between"><b>${esc(r.name)}</b><button class="btn small danger" onclick="remove('routines','${r.id}')">×</button></div><p class="muted">${r.exercises.length} ejercicios</p><div class="actions">${button('Ver y editar',`openRoutine('${r.id}')`,'secondary')}${button('Entrenar',`startWorkout('${r.id}')`)}</div></div>`).join('')||empty('Crea una rutina personalizada.')}<h3>Historial</h3>${data.workouts.map(w=>`<div class="card"><b>${esc(w.name)}</b><p class="muted">${esc(w.date)} · ${w.exercises.length} ejercicios</p>${button('Ver sesión',`viewWorkout('${w.id}')`,'secondary small')}</div>`).join('')||empty('Aún no has entrenado con MiVida.')}`;
if(page==='Finanzas'){const movements=data.items.filter(x=>['Gasto','Ingreso'].includes(x.type));const income=movements.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+Number(x.amount||0),0),spent=movements.filter(x=>x.type==='Gasto').reduce((s,x)=>s+Number(x.amount||0),0);const month=financeMonth;const monthMov=movements.filter(x=>(x.date||'').slice(0,7)===month);const monthSpent=monthMov.filter(x=>x.type==='Gasto').reduce((s,x)=>s+Number(x.amount||0),0);const monthIncome=monthMov.filter(x=>x.type==='Ingreso').reduce((s,x)=>s+Number(x.amount||0),0);return h+`<div class="card tint"><div class="muted">BALANCE DE MOVIMIENTOS REGISTRADOS</div><h1>${money(income-spent)}</h1><div class="muted">No es tu saldo bancario. Empiezas en 0 € y solo se suman ingresos y gastos anotados.</div></div><div class="actions">${button('+ Gasto',"add('Gasto')")}${button('+ Ingreso',"add('Ingreso')",'secondary')}</div><div class="card"><div class="row between"><strong>Resumen mensual</strong><input aria-label="Mes de finanzas" style="max-width:165px" type="month" value="${esc(month)}" onchange="financeMonth=this.value;render()"></div><div class="grid"><div><small>Ingresos</small><h3>${money(monthIncome)}</h3></div><div><small>Gastos</small><h3>${money(monthSpent)}</h3></div></div></div><h3>Presupuestos de ${esc(month)}</h3>${button('+ Presupuesto',"add('Presupuesto')",'secondary')}${data.budgets.filter(b=>b.month===month).map(b=>{const used=monthMov.filter(x=>x.type==='Gasto'&&(x.category||'Sin categoría')===b.category).reduce((n,x)=>n+Number(x.amount||0),0);const pct=Math.min(100,used/Math.max(0.01,b.limit)*100);return `<div class="card"><div class="row between"><b>${esc(b.category)}</b><span>${money(used)} / ${money(b.limit)}</span></div><div style="height:8px;background:var(--border,#ddd);border-radius:12px;overflow:hidden;margin:10px 0"><div style="height:100%;width:${pct}%;background:${used>b.limit?'#d75a5a':'#6879e6'}"></div></div><small>${used>b.limit?'Presupuesto superado en '+money(used-b.limit):'Disponible: '+money(b.limit-used)}</small><div class="actions">${button('Editar',`editItem('budgets','${b.id}')`,'secondary')}${button('Eliminar',`remove('budgets','${b.id}')`,'danger')}</div></div>`}).join('')||empty('Sin presupuestos para este mes.')}<h3>Metas de ahorro</h3>${button('+ Meta de ahorro',"add('Meta de ahorro')",'secondary')}<p class="muted">El ahorro reservado es un seguimiento manual: no se resta otra vez del balance de movimientos.</p>${data.savingsGoals.map(g=>{const saved=Number(g.saved||0),target=Number(g.target||0);return `<div class="card"><div class="row between"><b>${esc(g.name)}</b><span>${money(saved)} / ${money(target)}</span></div><progress style="width:100%" max="100" value="${Math.min(100,saved/Math.max(.01,target)*100)}"></progress><div class="actions">${button('Editar',`editItem('savingsGoals','${g.id}')`,'secondary')}${button('Eliminar',`remove('savingsGoals','${g.id}')`,'danger')}</div></div>`}).join('')||empty('Aún no tienes metas de ahorro.')}<h3>Movimientos</h3>${movements.map(x=>`<div class="listitem"><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(x.date||'Sin fecha')} · ${esc(x.category||'Sin categoría')} · ${esc(x.type)}</small></div><b>${x.type==='Gasto'?'-':'+'}${money(x.amount)}</b><button class="btn small secondary" onclick="editItem('items','${x.id}')">✎</button><button class="btn small danger" onclick="remove('items','${x.id}')">×</button></div>`).join('')||empty('Empiezas en 0 €. Añade tus movimientos.')}`}

if(page==='Hábitos')return h+`${button('+ Hábito',"add('Hábito')")}<p class="muted">Marca los días en los que cumples cada hábito. Cada semana comienza de nuevo, pero el historial queda guardado en el dispositivo.</p>${data.habits.map(x=>habitCard(x)).join('')||empty('Todavía no tienes hábitos.')}`;
if(page==='Objetivos')return h+`${button('+ Objetivo',"add('Objetivo')")}${data.goals.map(x=>`<div class="card"><b>${esc(x.name)}</b><p class="muted">${esc(x.note||'')}</p><div class="actions">${button('Editar',`editItem('goals','${x.id}')`,'secondary')}${button('Eliminar',`remove('goals','${x.id}')`,'danger')}</div></div>`).join('')||empty('Añade una meta personal.')}`;
if(page==='Compras')return h+`${button('+ Compra',"add('Compra')")}<h3>Necesidades y deseos</h3>${data.purchases.map(x=>`<div class="listitem"><input class="check" type="checkbox" ${x.bought?'checked':''} onchange="purchase('${x.id}',this.checked)"><div class="grow"><strong>${esc(x.name)}</strong><small>${esc(x.category)} · Estimado ${money(x.estimate)}</small></div><button class="btn small secondary" onclick="editItem('purchases','${x.id}')">✎</button><button class="btn small danger" onclick="remove('purchases','${x.id}')">×</button></div>`).join('')||empty('Tu lista de compras está vacía.')}${pendingPurchase?`<div class="card"><b>¿Registrar el gasto de ${esc(pendingPurchase.name)}?</b><p class="muted">La compra ya está marcada como realizada. Registrar el gasto es opcional.</p>${fields('Precio real pagado (€)','real','number',pendingPurchase.estimate,'step="0.01" min="0"')}<div class="actions">${button('Registrar gasto','recordPurchase()')}${button('No, gracias','pendingPurchase=null;render()','secondary')}</div></div>`:''}`;
if(page==='Salud'||page==='Hobbies'||page==='Bandeja'){const types=page==='Salud'?['Cita médica']:page==='Hobbies'?['Plan','Idea']:['Nota'];return h+`${button('+ Añadir',`add('${types[0]}')`)}${data.items.filter(x=>types.includes(x.type)).map(x=>itemRow(x)).join('')||empty('Este apartado está vacío.')}`}
if(page==='Asistente')return h+`<div class="card tint"><b>Asistente de texto · versión inicial</b><p class="muted">Registra gastos, ingresos, tareas y exámenes con fecha. Consulta tus movimientos. No es una IA completa.</p></div>${data.messages.slice(-14).map(m=>`<div class="chat ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}${assistantPending?`<div class="notice">${esc(assistantPending.question)}</div>`:''}<label for="msg">Escribe una orden</label><textarea id="msg" placeholder="Me he gastado 12 euros en comida"></textarea><div class="actions">${button('Enviar','assistantSend()')}${undo?button('Deshacer','assistantUndo()','secondary'):''}</div><p class="muted">Ejemplos: «Me he gastado 12 euros en comida», «Añade un examen de inglés el 27 de noviembre de 2026», «Apunta tarea comprar pan», «¿Cuánto he gastado este mes?».</p>`;
if(page==='Ajustes')return h+`<div class="card"><h3>Recordatorios</h3><p class="muted">Avisos privados dentro de MiVida al abrir la aplicación. No funcionan como notificaciones de iOS cuando MiVida está cerrada.</p><label><input type="checkbox" style="width:auto" ${data.reminderSettings.enabled?'checked':''} onchange="updateReminderSetting('enabled',this.checked)"> Mostrar recordatorios en Mi día</label><label for="reminderDays">Anticipación</label><select id="reminderDays" onchange="updateReminderSetting('daysBefore',this.value)">${[0,1,2,3,7].map(n=>`<option value="${n}" ${Number(data.reminderSettings.daysBefore)===n?'selected':''}>${n===0?'El mismo día':n===1?'1 día antes':n+' días antes'}</option>`).join('')}</select></div><div class="card"><h3>Apariencia</h3><p class="muted">Automático sigue el aspecto claro u oscuro de tu iPhone.</p><label for="theme">Tema de MiVida</label><select id="theme" onchange="setTheme(this.value)"><option value="auto" ${data.theme==='auto'?'selected':''}>Automático (iPhone)</option><option value="light" ${data.theme==='light'?'selected':''}>Claro</option><option value="dark" ${data.theme==='dark'?'selected':''}>Oscuro</option></select></div><div class="card"><h3>Accesos de la barra inferior</h3><p class="muted">Mi día siempre permanece fijo. Elige otros tres.</p>${[1,2,3].map((n,i)=>`<label>Acceso ${n}</label><select id="shortcut${i}" onchange="setShortcut(${i},this.value)">${sections.filter(x=>x!=='Mi día').map(x=>`<option ${data.shortcuts[i]===x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}</div><div class="card"><h3>Tarjetas favoritas</h3>${sections.filter(x=>!['Mi día','Ajustes'].includes(x)).map(x=>`<label><input type="checkbox" style="width:auto" ${data.favorites.includes(x)?'checked':''} onchange="favorite('${x}',this.checked)"> ${icons[x]} ${x}</label>`).join('')}</div><div class="card"><h3>Privacidad</h3><p class="muted">Sin cuenta ni sincronización. Tus registros se guardan en este dispositivo; otras personas que abran MiVida desde otro móvil no verán tus registros. El asistente de texto funciona localmente.</p><p class="muted">No hay contraseña adicional: el acceso físico depende del bloqueo de tu iPhone.</p></div><div class="notice warn">Tus datos se guardan en este navegador del dispositivo. No hay copia de seguridad ni sincronización: borrar los datos de Safari o de la app puede eliminarlos.</div>`

if(window.matchMedia){const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');if(systemTheme.addEventListener)systemTheme.addEventListener('change',()=>{if(data.theme==='auto')applyTheme()})}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
